<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigiSpots</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--sea:#0f2530;--panel:#173340;--line:#2a4a5a;--ink:#e6eef0;--mute:#8fa9b4;--mid:#38b8a4}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--sea);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
#app{display:grid;grid-template-columns:280px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto}
h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.01em}
label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:13px}
select,input{background:var(--sea);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
select:focus-visible,input:focus-visible{outline:2px solid var(--mid);outline-offset:1px}
.chk{flex-direction:row;align-items:center;gap:8px;cursor:pointer;color:var(--ink)}
.chk input{padding:0;width:auto;accent-color:var(--mid)}
#keywrap h2{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:500}
#key{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#key>*{display:flex;align-items:center;gap:6px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;font-size:12px}
#key button{cursor:pointer}
#key button:hover{border-color:var(--mute)}
#key button[aria-pressed=true]{border-color:var(--ink);background:var(--sea)}
#key button:focus-visible{outline:2px solid var(--mid);outline-offset:1px}
#key i{width:10px;height:10px;border-radius:50%;flex:none}
.snr{width:0;height:0}
.snr .b{position:absolute;left:-6px;bottom:7px;white-space:nowrap;background:var(--panel);color:var(--ink);border:1.5px solid var(--c);border-radius:9px 9px 9px 2px;padding:1px 7px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer}
.leaflet-tooltip{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.4);padding:8px 10px;font-size:13px;line-height:1.35}
.leaflet-tooltip-top:before{border-top-color:var(--line)}
.tip div{white-space:nowrap}
.tip .tip-call{font-weight:600;font-size:15px;margin-bottom:2px}
.tip .tip-snr{font-weight:600}
.tip .tip-dim{color:var(--mute)}
#stats{border-top:1px solid var(--line);padding-top:12px}
#stats h2{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:500}
#stats dl{margin:0;display:grid;gap:10px}
#stats dt{color:var(--mute);font-size:12px}
#stats dd{margin:0;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
#stats dd span{color:var(--mute);font-size:12px}
.embed #stats{border-top:0;padding-top:0}
.embed #stats dl{grid-auto-flow:column;gap:18px}
#status{margin-top:auto;color:var(--mute);font-size:13px}
#status b{color:var(--ink);font-variant-numeric:tabular-nums}
#map{height:100%;background:var(--sea)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.85) saturate(.6)}
.leaflet-control-attribution a{color:#8fa9b4}
.leaflet-container{background:var(--sea)}
@media(max-width:720px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap}#status{margin:0}}
/* embed mode: ?embed=1 puts the controls in a strip above the map and matches the site palette */
.embed #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.embed aside{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;align-items:flex-end;padding:10px 14px}
.embed h1{display:none}
.embed #status{margin:0 0 0 auto}
.embed #keywrap{width:260px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<aside>
  <h1>DigiSpots</h1>
  <label>Band
    <select id="band"><option value="">All bands</option>
    <option>160m</option><option>80m</option><option>60m</option><option>40m</option><option>30m</option>
    <option>20m</option><option>17m</option><option>15m</option><option>12m</option><option>10m</option><option>6m</option></select></label>
  <label>Mode
    <select id="mode"><option value="">All modes</option><option>FT8</option><option>FT4</option><option>JT65</option><option>WSPR</option><option>CW</option></select></label>
  <label>Callsign
    <input id="call" placeholder="e.g. G4ABC" autocomplete="off" spellcheck="false"></label>
  <label>Direction (needs a callsign)
    <select id="dir"><option value="tx">Stations that hear me</option><option value="rx">Stations I hear</option><option value="">Both</option></select></label>
  <label>Show last
    <select id="mins"><option value="5">5 minutes</option><option value="15" selected>15 minutes</option><option value="30">30 minutes</option><option value="60">60 minutes</option></select></label>
  <label class="chk"><input type="checkbox" id="labels" checked> Show SNR labels at receivers</label>
  <div id="keywrap"><h2>Band colours (click to filter)</h2><div id="key"></div></div>
  <div id="stats">
  <h2>Highlights for these filters</h2>
  <dl>
    <dt>Best SNR</dt><dd id="s-snr">–</dd>
    <dt>Furthest path</dt><dd id="s-far">–</dd>
    <dt>Stations heard</dt><dd id="s-st">–</dd>
  </dl>
</div>
<div id="status">Connecting…</div>
</aside>
<div id="map"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const map=L.map("map",{worldCopyJump:true,zoomControl:true,preferCanvas:true}).setView([30,10],2);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:10,minZoom:2}).addTo(map);

const $=id=>document.getElementById(id), layer=L.layerGroup().addTo(map);
const P=new URLSearchParams(location.search);
if(P.has("embed")){document.documentElement.style.cssText+="--sea:#0f172a;--panel:#1e293b;--line:#334155";document.body.classList.add("embed")}
["band","mode","call","dir","mins"].forEach(k=>{if(P.get(k)!==null)$(k).value=P.get(k)});
let drawn=[], total=0;
const filter=()=>({band:$("band").value,mode:$("mode").value,call:$("call").value.trim(),dir:$("dir").value});

function grid(g){
  if(!g||g.length<4)return null; g=g.toUpperCase();
  let lon=(g.charCodeAt(0)-65)*20-180+(+g[2])*2, lat=(g.charCodeAt(1)-65)*10-90+(+g[3]);
  if(g.length>=6){lon+=(g.charCodeAt(4)-65)/12+1/24;lat+=(g.charCodeAt(5)-65)/24+1/48}
  else{lon+=1;lat+=.5}
  return isNaN(lat+lon)?null:[lat,lon];
}
function arc(a,b,n=28){ // great-circle path, longitudes unwrapped to avoid map-wide lines
  const r=Math.PI/180,[la1,lo1,la2,lo2]=[a[0]*r,a[1]*r,b[0]*r,b[1]*r];
  const d=2*Math.asin(Math.sqrt(Math.sin((la2-la1)/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2));
  if(d<1e-6)return[a,b];
  const pts=[];let prev=a[1];
  for(let i=0;i<=n;i++){
    const f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
    const x=A*Math.cos(la1)*Math.cos(lo1)+B*Math.cos(la2)*Math.cos(lo2);
    const y=A*Math.cos(la1)*Math.sin(lo1)+B*Math.cos(la2)*Math.sin(lo2);
    const z=A*Math.sin(la1)+B*Math.sin(la2);
    let lon=Math.atan2(y,x)/r; while(lon-prev>180)lon-=360; while(lon-prev<-180)lon+=360;
    prev=lon; pts.push([Math.atan2(z,Math.hypot(x,y))/r,lon]);
  }
  return pts;
}
function km(a,b){
  const r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;
  const h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;
  return 12742*Math.asin(Math.sqrt(h));
}
function stats(){
  let best=null,far=null;const calls=new Set();
  for(const e of drawn){
    calls.add(e.s.sc);calls.add(e.s.rc);
    if(e.s.snr!=null&&(!best||e.s.snr>best.snr))best=e.s;
    if(!far||e.d>far.d)far=e;
  }
  const set=(id,main,sub)=>{ // textContent only: callsigns come from the network
    const el=$(id);el.textContent="";
    if(!main){el.textContent="–";return}
    const b=document.createElement("b"),s=document.createElement("span");
    b.textContent=main;s.textContent=sub;el.append(b,s);
  };
  set("s-snr",best&&(best.snr>0?"+":"")+best.snr+" dB",best&&best.sc+" to "+best.rc+(best.b?", "+best.b:""));
  set("s-far",far&&Math.round(far.d).toLocaleString()+" km ("+Math.round(far.d*0.621371).toLocaleString()+" mi)",
      far&&far.s.sc+" to "+far.s.rc+(far.s.b?", "+far.s.b:""));
  set("s-st",calls.size?calls.size.toLocaleString():"",calls.size?"in "+drawn.length.toLocaleString()+" paths":"");
}
const BANDS={"160m":"#f87171","80m":"#fb923c","60m":"#c8a27a","40m":"#facc15","30m":"#a3e635","20m":"#22d3ee",
  "17m":"#60a5fa","15m":"#a78bfa","12m":"#e879f9","10m":"#f472b6","6m":"#ffffff"};
const bandColor=b=>BANDS[b]||"#94a3b8";
for(const [b,c] of [...Object.entries(BANDS),["Other","#94a3b8"]]){
  const el=document.createElement(b==="Other"?"div":"button"),dot=document.createElement("i");
  dot.style.background=c;el.append(dot,b);el.dataset.band=b;
  if(b!=="Other"){el.type="button";el.setAttribute("aria-pressed","false");
    el.onclick=()=>{$("band").value=$("band").value===b?"":b;reload()}}
  $("key").append(el);
}
const syncKey=()=>$("key").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String($("band").value===b.dataset.band)));
function brg(a,b){
  const r=Math.PI/180,p1=a[0]*r,p2=b[0]*r,dl=(b[1]-a[1])*r;
  return (Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))/r+360)%360;
}
const age=t=>{const m=Math.floor((Date.now()/1000-t)/60);return m<1?"now":m<120?m+"m":Math.floor(m/60)+"h"};
const LABEL_MAX=250;let labelsOn=false;
function labText(e){if(!e.labEl)return;e.labEl.textContent=age(e.s.t)+" "+(e.s.snr!=null?(e.s.snr>0?"+":"")+e.s.snr+"dB":"?")}
function showLab(e){
  if(!e.lab){
    const el=document.createElement("div"),b=document.createElement("span");
    b.className="b";b.style.setProperty("--c",e.c);el.append(b);e.labEl=b;
    e.lab=L.marker(e.end,{icon:L.divIcon({className:"snr",html:el,iconSize:[0,0],iconAnchor:[0,0]}),zIndexOffset:500});
    e.lab.bindTooltip(()=>tip(e.s,e.d,e.br,e.rxm),{direction:"top",offset:[22,-24],opacity:1});
  }
  labText(e);layer.addLayer(e.lab);
}
const hideLab=e=>{if(e.lab)layer.removeLayer(e.lab)};
function isRx(s){ // true when the filtered callsign is the receiver, so the other station is the sender
  const me=$("call").value.trim().toUpperCase();
  return !!me&&$("dir").value!=="tx"&&s.rc.toUpperCase().includes(me)&&!s.sc.toUpperCase().includes(me);
}
function tip(s,d,br,rxm){ // DOM + textContent only: callsigns come from the network
  const el=document.createElement("div"),row=(t,c)=>{const x=document.createElement("div");if(c)x.className=c;x.textContent=t;el.append(x)};
  el.className="tip";
  const o=rxm?{c:s.sc,g:s.sl,by:s.rc,bg:s.rl}:{c:s.rc,g:s.rl,by:s.sc,bg:s.sl};
  row(o.c,"tip-call");
  row("Grid "+o.g,"tip-dim");
  row(s.snr!=null?(s.snr>0?"+":"")+s.snr+" dB SNR":"SNR not reported","tip-snr");
  row((rxm?"Heard by ":"Heard ")+o.by+" ("+o.bg+")");
  row([s.b,s.md,s.f?(s.f/1e6).toFixed(3)+" MHz":null].filter(Boolean).join(", "));
  row(Math.round(d).toLocaleString()+" km ("+Math.round(d*0.621371).toLocaleString()+" mi), bearing "+Math.round(br)+"°","tip-dim");
  row(new Date(s.t*1000).toISOString().slice(11,16)+" UTC","tip-dim");
  return el;
}
function draw(s){
  const a=grid(s.sl),b=grid(s.rl); if(!a||!b)return;
  const pts=arc(a,b),c=bandColor(s.b),d=km(a,b),br=brg(a,b),rxm=isRx(s),end=rxm?pts[0]:pts[pts.length-1];
  const line=L.polyline(pts,{color:c,weight:1.4,opacity:.6,interactive:false}).addTo(layer);
  const dot=L.circleMarker(end,{radius:3.5,color:"#0f2530",weight:1,fillColor:c,fillOpacity:.95}).addTo(layer);
  dot.bindTooltip(()=>tip(s,d,br,rxm),{direction:"top",offset:[0,-4],opacity:1});
  const e={t:s.t,line,dot,s,d,br,end,c,rxm};
  drawn.push(e); total++;
  if(labelsOn&&drawn.length<=LABEL_MAX)showLab(e);
}
function drop(){const e=drawn.shift();layer.removeLayer(e.line);layer.removeLayer(e.dot);hideLab(e)}
function prune(){
  const cut=Date.now()/1000-(+$("mins").value)*60;
  while(drawn.length&&drawn[0].t<cut)drop();
  while(drawn.length>4000)drop();
  const want=$("labels").checked&&drawn.length<=LABEL_MAX;
  if(want!==labelsOn){labelsOn=want;drawn.forEach(e=>want?showLab(e):hideLab(e))}
  else if(labelsOn)drawn.forEach(labText);
  stats();
  const hint=$("labels").checked&&!want?" (SNR labels show at "+LABEL_MAX+" paths or fewer; try a band or callsign filter)":"";
  $("status").innerHTML=`<b>${drawn.length.toLocaleString()}</b> paths shown`+hint+(ws.readyState===1?"":" (reconnecting…)");
}
async function reload(){
  layer.clearLayers();drawn=[];labelsOn=false;syncKey();
  const f=filter(),q=new URLSearchParams({...f,minutes:$("mins").value,limit:3000});
  try{(await (await fetch("/api/spots?"+q)).json()).reverse().forEach(draw)}catch(e){}
  if(ws.readyState===1)ws.send(JSON.stringify(f)); prune();
}
let ws;
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onopen=()=>ws.send(JSON.stringify(filter()));
  ws.onmessage=e=>JSON.parse(e.data).forEach(draw);
  ws.onclose=()=>setTimeout(connect,3000);
}
connect();
["band","mode","dir","mins"].forEach(i=>$(i).onchange=reload);
$("labels").onchange=prune;
let tm;$("call").oninput=()=>{clearTimeout(tm);tm=setTimeout(reload,400)};
setInterval(prune,5000); reload();
</script>
</body>
</html>
